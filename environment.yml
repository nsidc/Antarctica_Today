name: antarctica_today
channels:
  - conda-forge
  - nodefaults
platforms:
  - linux-64
dependencies:

  # Runtime dependencies
  # --------------------
  - click ~=8.1
  - loguru ~=0.7.2
  - pydantic ~=2.8.2
  - pydantic-settings
  - earthaccess ~=0.10.0
  - gdal ~=3.5
  - pandas ~=1.4
  - numpy ~=1.26.2
  - statsmodels
  - geopandas ~=0.14.0
  - cartopy ~=0.21.0
  - python-dateutil ~=2.8
  - pillow ~=9.2
  - cairo  # NOTE: includes `gi`

  ## Currently, numpy's pin keeps Xarray back at v2022.09
  - xarray
  - netcdf4


  # Development dependencies
  # ------------------------
  - matplotlib-base
  - pre-commit
  - conda-lock
  - pytest
  - pytest-cov

  - mypy
  - types-pillow ~=9.2
  - types-python-dateutil
  - pandas-stubs
